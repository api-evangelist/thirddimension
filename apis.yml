aid: thirddimension
name: Third Dimension AI
description: Third Dimension AI is a spatial-generation company building high-fidelity
  3D worlds and simulation for embodied AI, autonomy, robotics, gaming, and entertainment.
  Its core product, SuperSim, models the world across the full fidelity spectrum -
  from real-world reconstruction of scenes captured from sensor data to open-ended
  generative simulation - so autonomy teams can validate, train, and deploy AI systems
  and close the simulation-to-reality domain gap without hand-built 3D art. Founded
  by Tolga Kart (CEO) and Piotr Sokolski (CTO), with Oxford professor Christian Rupprecht
  as Chief Researcher, the team draws on experience from Wayve, Tesla, Google, Luma
  AI, Nvidia, Niantic, Amazon, and Unity. The company raised $7 million and is backed
  by Felicis. As of this profile it exposes no public developer API, SDK, or documentation
  surface; enrichment captured its identity and probed its domain security posture.
